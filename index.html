    body {

      background: #ffffff; /* fond blanc */

      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      animation: fadeIn 0.8s ease-in-out;
    }

      width: 110px;
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 500;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.6;
      font-size: 14px;
    }

    /* Loader jaune */
    .loader {
      margin: 30px auto;
      border: 4px solid rgba(0,0,0,0.1);
      border-top: 4px solid #9b1919; /* jaune */
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    // 👉 Mets ton lien ici
    const redirectUrl = "/";

    // Redirection après 2 secondes
    setTimeout(() => {
      window.location.href = redirectUrl;
    }, 2000);
